<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>五子棋 · 15×15</title>
<style>
  :root{
    --ink:#2a1d10; --panel:#14100c; --panel2:#1d1712; --line:#3a2c1d;
    --txt:#f0e6d6; --dim:#a08d74; --accent:#e0483c; --ok:#4fb477;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB",system-ui,sans-serif;
    background:radial-gradient(1200px 800px at 50% -10%,#241c14 0%,#100d0a 55%,#0a0807 100%);
    color:var(--txt); padding:22px;
    /* NOT flex-centred: centring a too-tall child pushes its top off-screen
       and it becomes unscrollable.  Use auto margins on the wrapper instead. */
    display:block;
    min-height:100%;
    overflow-y:auto;
  }
  .wrap{
    display:flex; gap:24px; align-items:flex-start; justify-content:center; flex-wrap:wrap;
    max-width:1180px; width:100%; margin:0 auto;
  }
  .boardbox{
    background:linear-gradient(160deg,#3a2a19,#241a10); padding:13px; border-radius:18px;
    box-shadow:0 24px 60px rgba(0,0,0,.55), inset 0 0 0 1px rgba(255,220,170,.10);
    position:relative;
    /* keep the board stable while the side panel grows/shrinks */
    align-self:flex-start;
    flex:0 0 auto;
  }
  svg{
    display:block; height:auto; border-radius:8px; touch-action:manipulation;
    /* size by BOTH viewport height and width so the board never overflows */
    width:min(72vh, 640px, 58vw);
  }
  svg.thinking{cursor:progress}
  svg.human{cursor:pointer}

  aside{
    width:306px; min-width:270px; flex:1 1 270px; background:linear-gradient(180deg,var(--panel2),var(--panel));
    border:1px solid var(--line); border-radius:18px; padding:18px 16px; display:flex; flex-direction:column;
    box-shadow:0 24px 60px rgba(0,0,0,.45);
    /* pin the panel: it scrolls internally instead of growing the page */
    align-self:flex-start;
    max-height:calc(100vh - 44px);
    overflow-y:auto;
    scrollbar-width:thin;
  }
  aside::-webkit-scrollbar{width:7px}
  aside::-webkit-scrollbar-thumb{background:#3a2c1d;border-radius:4px}
  h1{font-size:16px; margin:0 0 3px; letter-spacing:.4px}
  .sub{font-size:11.5px; color:var(--dim); margin-bottom:13px}
  .status{
    display:flex; align-items:center; gap:9px; font-size:13.5px; padding:10px 12px; border-radius:11px;
    background:rgba(224,72,60,.10); border:1px solid rgba(224,72,60,.28); margin-bottom:12px; min-height:42px;
    transition:background .2s,border-color .2s;
  }
  .status.think{background:rgba(255,190,90,.10); border-color:rgba(255,190,90,.32)}
  .status.over{background:rgba(79,180,119,.12); border-color:rgba(79,180,119,.35)}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent);flex:none}
  .status.think .dot{background:#ffbe5a;box-shadow:0 0 12px #ffbe5a;animation:pulse .9s infinite}
  .status.over .dot{background:var(--ok);box-shadow:0 0 12px var(--ok)}
  @keyframes pulse{50%{opacity:.35}}

  .row{display:flex; gap:8px; margin-bottom:10px}
  button{
    flex:1; font:inherit; font-size:13px; padding:9px 10px; border-radius:10px; cursor:pointer;
    background:linear-gradient(180deg,#2e2418,#241c13); color:#e8dcc8; border:1px solid #46341f;
    transition:transform .08s, background .15s, border-color .15s;
  }
  button:hover:not(:disabled){background:linear-gradient(180deg,#3a2d1d,#2a2016); border-color:#5c452a}
  button:active:not(:disabled){transform:translateY(1px)}
  button:disabled{opacity:.38; cursor:not-allowed}
  button.primary{background:linear-gradient(180deg,#5a2a24,#3d1c18); border-color:#7a3a31}
  button.primary:hover:not(:disabled){background:linear-gradient(180deg,#6e332b,#48211c)}
  .lvl{display:flex; align-items:center; gap:8px; font-size:12px; color:var(--dim); margin-bottom:12px}
  select{
    flex:1; font:inherit; font-size:12.5px; padding:7px 9px; border-radius:9px; color:#e8dcc8;
    background:#241c13; border:1px solid #46341f; outline:none;
  }
  .moves{flex:1; overflow:auto; max-height:40vh; min-height:120px; padding-right:4px; margin-bottom:10px}  .moves::-webkit-scrollbar{width:6px}
  .moves::-webkit-scrollbar-thumb{background:#3a2c1d;border-radius:3px}
  .mv{display:flex; align-items:center; gap:9px; padding:5px 8px; border-radius:8px; font-size:12.5px; color:#d8cbb8}
  .mv:nth-child(odd){background:rgba(255,255,255,.025)}
  .mv.last{background:rgba(224,72,60,.16); color:#fff; box-shadow:inset 0 0 0 1px rgba(224,72,60,.35)}
  .mv .n{width:26px; text-align:right; color:var(--dim); font-variant-numeric:tabular-nums; font-size:11.5px}
  .mv.last .n{color:#f0a49c}
  .st{width:15px;height:15px;border-radius:50%;flex:none}
  .st.b{background:radial-gradient(circle at 32% 30%,#6e6e78,#0a0a0e 72%);box-shadow:0 1px 3px rgba(0,0,0,.7)}
  .st.w{background:radial-gradient(circle at 32% 30%,#ffffff,#b9b9c4 74%);box-shadow:0 1px 3px rgba(0,0,0,.5)}
  .mv .c{font-weight:600; letter-spacing:.4px}
  .mv .tag{margin-left:auto; font-size:10.5px; color:#8d7a63}
  .legend{padding-top:11px; border-top:1px solid var(--line); font-size:11.5px; color:var(--dim); line-height:1.7}
  .legend b{color:#e6d9c4; font-weight:600}
  .toggle{display:flex; align-items:center; gap:8px; margin:8px 0 0; font-size:11.5px; color:var(--dim); cursor:pointer; user-select:none}
  .toggle input{accent-color:var(--accent)}
  .toggle b{color:#e6d9c4; font-weight:600}
  .rules{
    border:1px solid var(--line); border-radius:11px; padding:6px 10px 10px; margin-bottom:12px;
    background:rgba(255,255,255,.015);
  }
  .rules .toggle{margin-top:7px; line-height:1.45; align-items:flex-start}
  .rules .toggle input{margin-top:2px; flex:none}
  .indent{margin-left:2px; opacity:.85}
  .rules.collapsed{display:none}

  /* ---------------- setup / analysis mode ---------------- */
  .setup{
    border:1px solid var(--line); border-radius:11px; padding:9px 10px; margin-bottom:12px;
    background:rgba(255,255,255,.015);
  }
  .setup-head{display:flex; align-items:center; gap:8px}
  .setup-toggle{
    flex:none; width:auto; padding:7px 12px; font-size:12.5px;
    background:linear-gradient(180deg,#2e2418,#241c13); border:1px solid #46341f;
  }
  .setup-toggle.on{
    background:linear-gradient(180deg,#3f5a3a,#2a3d27); border-color:#4f7a48; color:#d8f0d0;
  }
  .setup-hint{font-size:11px; color:var(--dim); flex:1; text-align:right}
  .setup-body{display:none; margin-top:10px}
  .setup-body.open{display:block}
  .paint{font-size:12px; padding:8px 6px}
  .paint.active{background:linear-gradient(180deg,#5a2a24,#3d1c18); border-color:#7a3a31; color:#fff}
  .setup-note{font-size:10.5px; color:var(--dim); line-height:1.6; margin-top:8px}
  svg.painting{cursor:crosshair}
  svg.erasing{cursor:not-allowed}
  .toast{
    position:absolute; left:50%; top:14px; transform:translate(-50%,-14px); opacity:0; pointer-events:none;
    background:rgba(20,14,10,.92); border:1px solid #5c452a; color:#f0e6d6; font-size:12.5px;
    padding:8px 14px; border-radius:10px; transition:opacity .18s, transform .18s; white-space:nowrap;
  }
  .toast.show{opacity:1; transform:translate(-50%,0)}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
  .shake{animation:shake .22s}

  /* ---------------- mobile / tablet ---------------- */
  @media (max-width: 820px), (pointer: coarse){
    body{padding:10px}
    .wrap{gap:12px; flex-direction:column; align-items:center}
    .boardbox{padding:8px; border-radius:14px; width:100%; max-width:min(96vw,560px)}
    svg{width:100%; max-width:100%}
    aside{
      width:100%; max-width:min(96vw,560px); padding:14px 13px;
      border-radius:14px; min-width:0;
      max-height:none;          /* let the page scroll on phones */
      overflow-y:visible;
    }
    .moves{max-height:26vh; min-height:76px}
    .lvl{font-size:11.5px}
    select{font-size:12px; padding:8px}
    button{font-size:13px; padding:11px 10px}   /* bigger tap target */
    h1{font-size:15px}
    .legend{font-size:11px}
    .toast{font-size:12px; white-space:normal; max-width:88vw; text-align:center}
  }
  @media (max-width: 820px) and (orientation: landscape){
    .wrap{flex-direction:row; align-items:flex-start}
    .boardbox{max-width:min(62vw,520px)}
    svg{width:min(62vw, 78vh)}
    aside{max-width:36vw; width:36vw; max-height:calc(100vh - 20px); overflow-y:auto}
    .moves{max-height:40vh}
  }
  /* short desktop windows: shrink the board so the whole thing fits */
  @media (min-width: 821px) and (max-height: 760px){
    svg{width:min(84vh, 560px, 52vw)}
    aside{max-height:calc(100vh - 30px)}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="boardbox">
    <svg id="board" viewBox="0 0 768 768" xmlns="http://www.w3.org/2000/svg"></svg>
    <div class="toast" id="toast"></div>
  </div>

  <aside>
    <h1>五子棋 · 15×15</h1>
    <div class="sub" id="whoSub">● 黑 = AI&nbsp;&nbsp;&nbsp;○ 白 = 你&nbsp;&nbsp;&nbsp;点击棋盘落子</div>

    <div class="status" id="statusBox"><span class="dot"></span><span id="statusText">准备中…</span></div>

    <div class="lvl">
      <span>AI 强度</span>
      <select id="level">
        <option value="500">快速（0.5 秒）</option>
        <option value="1500" selected>标准（1.5 秒）</option>
        <option value="3500">强力（3.5 秒）</option>
      </select>
    </div>

    <div class="lvl">
      <span>我执</span>
      <select id="side">
        <option value="W" selected>白棋（后手）</option>
        <option value="B">黑棋（先手）</option>
      </select>
    </div>

    <div class="lvl">
      <span>先手颜色</span>
      <select id="firstColor">
        <option value="B" selected>黑棋先走</option>
        <option value="W">白棋先走（交换）</option>
      </select>
    </div>

    <div class="lvl">
      <span>棋盘</span>
      <select id="boardSize">
        <option value="15" selected>15×15（标准）</option>
        <option value="13">13×13</option>
        <option value="11">11×11</option>
        <option value="9">9×9（平局模式最佳）</option>
      </select>
    </div>

    <div class="rules">
      <label class="toggle"><input type="checkbox" id="optTwoPlayer"> <b>双人对战</b>（关掉 AI，两个人轮流下）</label>
      <label class="toggle"><input type="checkbox" id="optDrawMode"> <b>平局模式</b>（AI 专门阻止任何人成五，包括它自己）</label>
      <label class="toggle"><input type="checkbox" id="optRenju"> <b>禁手规则</b>（黑棋三三 / 四四 / 长连判负）</label>
      <label class="toggle"><input type="checkbox" id="optHandicap"> <b>让子模式</b>（白棋开局连下两子）</label>
      <label class="toggle"><input type="checkbox" id="optHandicapAi"> <span class="indent">让子给 AI（你执黑时）</span></label>
      <label class="toggle"><input type="checkbox" id="optNerf"> <b>AI 先手时自动降档</b>（降低搜索深度、关闭算杀）</label>
    </div>

    <div class="row">
      <button id="undo" title="撤销上一回合（快捷键 Ctrl+Z）">↶ 悔棋</button>
      <button id="restart" class="primary" title="清空重来（快捷键 R）">重新开始</button>
    </div>

    <div class="row">
      <button id="copyRecord" title="复制完整棋谱到剪贴板">📋 复制棋谱</button>
      <button id="togglePanel" title="收起/展开设置">⚙ 设置</button>
    </div>

    <div class="setup" id="setupBox">
      <div class="setup-head">
        <button id="setupBtn" class="setup-toggle">✎ 摆棋模式</button>
        <span id="setupHint" class="setup-hint"></span>
      </div>
      <div class="setup-body" id="setupBody">
        <div class="row" style="margin-bottom:8px">
          <button id="paintBlack" class="paint active">● 画黑棋</button>
          <button id="paintWhite" class="paint">○ 画白棋</button>
        </div>
        <div class="row" style="margin-bottom:8px">
          <button id="setupErase">✕ 擦除</button>
          <button id="setupClear">清空棋盘</button>
        </div>
        <div class="row" style="margin-bottom:8px">
          <button id="setupDone" class="primary">✓ 完成摆棋</button>
        </div>
        <div class="lvl" style="margin-bottom:0">
          <span>接着由</span>
          <select id="setupNext">
            <option value="human" selected>我来下</option>
            <option value="ai">AI 来下</option>
          </select>
        </div>
        <div class="setup-note">
          点棋盘放子 · 右键或点「擦除」删子<br>
          摆好后选「AI 来下」让它接着走
        </div>
      </div>
    </div>

    <div class="moves" id="moves"></div>

    <label class="toggle"><input type="checkbox" id="showNum" checked> 显示手数</label>
    <label class="toggle"><input type="checkbox" id="showGhost" checked> 悬停预览落点</label>

    <div class="legend">
      红圈 = 最新一手&nbsp;&nbsp;·&nbsp;&nbsp;绿圈 = 五连获胜<br>
      列 <b>A–O</b>，行 <b>1–15</b>，<b>第 1 行在最下方</b><br>
      点错了就按 <b>悔棋</b>，会退回你上一步之前
    </div>
  </aside>
</div>

<script>

(function(){
  // ---- module scaffolding for the CommonJS engine sources ----
  var __modules = {};
  var __cache = {};
  function __req(name){
    name = String(name).replace(/^\.\//, '').replace(/\.js$/, '');
    if (__cache[name]) return __cache[name].exports;
    var fn = __modules[name];
    if (!fn) throw new Error('module not found: ' + name);
    var m = { exports: {} };
    __cache[name] = m;
    fn(m, m.exports, __req);
    return m.exports;
  }

  __modules['forbidden'] = function(module, exports, require){

    /**
     * Renju forbidden-move detection for BLACK.
     *
     * Definitions used (on a board with the candidate black stone already placed):
     *
     *   five      : exactly five in a row through the stone
     *   overline  : six or more in a row through the stone          -> forbidden
     *   four      : a line of five cells that contains exactly 4 black + 1 empty,
     *               i.e. one move away from five, with the fifth point playable
     *   straight  : a four whose completing point is "open" on both sides
     *               (playing it would make a five AND still leave room)
     *   three     : a line where one more black stone creates a straight four
     *               (an "open three")
     *   double-four / double-three -> forbidden
     *
     * The key subtlety: a "four" must be a genuine four (4 stones + 1 gap in a
     * 5-window), not merely "some future move could reach five".
     *
     * Board: Int8Array(225), 0 empty, 1 black, 2 white, index = y*15 + x, y = 0 is bottom.
     */

    let N = 15;
    let SIZE = N * N;
    const DIRS = [[1, 0], [0, 1], [1, 1], [1, -1]];

    /** switch board size (the engine calls this when the board size changes) */
    function configureForbidden(size) {
      N = size;
      SIZE = N * N;
    }

    const at = (b, x, y) => (x < 0 || x >= N || y < 0 || y >= N ? -1 : b[y * N + x]);

    /** consecutive same-side stones from (x,y) outward in (dx,dy), excluding origin */
    function run(b, x, y, dx, dy, side) {
      let n = 0;
      for (let s = 1; s <= 5; s++) {
        if (at(b, x + dx * s, y + dy * s) !== side) break;
        n++;
      }
      return n;
    }

    /** line length through (x,y) for `side`, counting the stone at (x,y) */
    function lineLen(b, x, y, dx, dy, side) {
      return 1 + run(b, x, y, dx, dy, side) + run(b, x, y, -dx, -dy, side);
    }

    /**
     * Enumerate all 5-cell windows through (x,y) in all 4 directions.
     * Each window is described by its start point and direction.
     */
    function* windowsThrough(x, y) {
      for (const [dx, dy] of DIRS) {
        for (let off = 0; off < 5; off++) {
          const sx = x - dx * off, sy = y - dy * off;
          // window must be fully on the board
          const ex = sx + dx * 4, ey = sy + dy * 4;
          if (sx < 0 || sx >= N || sy < 0 || sy >= N) continue;
          if (ex < 0 || ex >= N || ey < 0 || ey >= N) continue;
          yield { sx, sy, dx, dy };
        }
      }
    }

    /** contents of a window: counts of black, white and the empty cells */
    function windowInfo(b, w, side) {
      let mine = 0, theirs = 0;
      const empties = [];
      for (let i = 0; i < 5; i++) {
        const v = at(b, w.sx + w.dx * i, w.sy + w.dy * i);
        if (v === side) mine++;
        else if (v === 0) empties.push([w.sx + w.dx * i, w.sy + w.dy * i]);
        else theirs++;
      }
      return { mine, theirs, empties };
    }

    /**
     * Does playing at (x,y) create a five for `side`?
     * (the stone must already be on the board at (x,y))
     */
    function makesFive(b, x, y, side) {
      for (const [dx, dy] of DIRS) {
        if (lineLen(b, x, y, dx, dy, side) === 5) return true;
      }
      return false;
    }

    function makesOverline(b, x, y, side) {
      for (const [dx, dy] of DIRS) {
        if (lineLen(b, x, y, dx, dy, side) >= 6) return true;
      }
      return false;
    }

    /**
     * Count "fours" created by the black stone at (x,y).
     * A four = a 5-window with exactly 4 black + 1 empty, where playing the empty
     * point would make exactly five (not an overline).
     *
     * IMPORTANT: an open four (e.g. _BBBB_ ) has TWO completing points but is still
     * only ONE four. So we group completing points by their line (direction + the
     * stones that make up the four), and count distinct lines.
     */
    function countFours(b, x, y) {
      const lines = new Set();
      for (const w of windowsThrough(x, y)) {
        const info = windowInfo(b, w, 1);
        if (info.mine !== 4 || info.theirs !== 0 || info.empties.length !== 1) continue;
        const [ex, ey] = info.empties[0];
        b[ey * N + ex] = 1;
        const five = makesFive(b, ex, ey, 1);
        const over = makesOverline(b, ex, ey, 1);
        b[ey * N + ex] = 0;
        if (!five || over) continue;

        // identify the four's line: direction + the occupied cells of this window
        // (an open four produces two windows that share the same 4 stones)
        const cells = [];
        for (let i = 0; i < 5; i++) {
          const px = w.sx + w.dx * i, py = w.sy + w.dy * i;
          if (at(b, px, py) === 1) cells.push(py * N + px);
        }
        cells.sort((a, c) => a - c);
        lines.add(cells.join(','));
      }
      return lines;
    }

    /**
     * Does the black stone at (x,y) sit on a STRAIGHT four?
     * A straight four = four black stones in a 5-window with the 5th cell empty,
     * AND the four can be completed at two different points (both ends open),
     * i.e. playing either end makes five.
     *
     * Concretely: look at each direction; take the run of black through (x,y);
     * if the run has exactly 4 stones and BOTH cells just beyond the run are empty,
     * it is a straight four.
     */
    function isStraightFourAt(b, x, y) {
      for (const [dx, dy] of DIRS) {
        const a = run(b, x, y, dx, dy, 1);
        const c = run(b, x, y, -dx, -dy, 1);
        if (a + c + 1 !== 4) continue;
        // the two cells immediately beyond the four
        const e1 = at(b, x + dx * (a + 1), y + dy * (a + 1));
        const e2 = at(b, x - dx * (c + 1), y - dy * (c + 1));
        if (e1 === 0 && e2 === 0) return true;
      }
      return false;
    }

    /**
     * Count "open threes" created by the black stone at (x,y).
     *
     * A three exists at direction d if there is an empty point q along d such that
     * placing black at q produces a straight four containing q.
     * Each such q counts once; two different q's on the same line still count once
     * (they are the same three), so we group by direction + line signature.
     */
    function countThrees(b, x, y) {
      const lines = new Set();
      for (const [dx, dy] of DIRS) {
        // walk outward up to 4 cells each way looking for an extension point
        for (let s = 1; s <= 4; s++) {
          for (const sign of [1, -1]) {
            const qx = x + dx * s * sign, qy = y + dy * s * sign;
            if (at(b, qx, qy) !== 0) continue;

            b[qy * N + qx] = 1;
            let straight = false;
            // q must not itself be five / overline, and must create a straight four
            if (!makesFive(b, qx, qy, 1) && !makesOverline(b, qx, qy, 1)) {
              straight = isStraightFourAt(b, qx, qy);
            }
            b[qy * N + qx] = 0;

            if (straight) {
              // line signature: direction + all black stones on that line through x,y
              const stones = [];
              for (let t = -5; t <= 5; t++) {
                const px = x + dx * t, py = y + dy * t;
                if (at(b, px, py) === 1) stones.push(py * N + px);
              }
              stones.push(y * N + x);
              stones.sort((m, n) => m - n);
              lines.add(dx + ',' + dy + ':' + stones.join(','));
            }
          }
        }
      }
      return lines;
    }

  // ---------------------------------------------------------------- rendering
  function stone(cx, cy, color){
    return el('circle', {cx:cx, cy:cy, r:R(),
                         fill: color === 'B' ? 'url(#gb)' : 'url(#gw)',
                         filter:'url(#sh)'}, stonesLayer);
  }

  function render(){
    stonesLayer.innerHTML = '';
    numLayer.innerHTML = '';
    winLayer.innerHTML = '';

    // during setup the board array is the source of truth (stones may have no order)
    const view = setupMode
      ? setupMoves
      : moves;

    view.forEach(m => {
      const col = m.cell.charCodeAt(0) - 65;
      const row = parseInt(m.cell.slice(1), 10) - 1;
      stone(PX(col), PY(row), m.color);
    });

    if (showNum.checked){
      view.forEach(m => {
        const col = m.cell.charCodeAt(0) - 65;
        const row = parseInt(m.cell.slice(1), 10) - 1;
        const t = el('text', {x:PX(col), y:PY(row) + 4.2, 'text-anchor':'middle',
                              'font-size':'12.5', 'font-family':'Arial,sans-serif',
                              'font-weight':'600', opacity:'0.9',
                              fill: m.color === 'B' ? '#f2f2f6' : '#2a2a30'}, numLayer);
        t.textContent = String(m.n);
      });
    }

    if (!setupMode && moves.length && status === 'playing'){
      const last = moves[moves.length - 1];
      const col = last.cell.charCodeAt(0) - 65;
      const row = parseInt(last.cell.slice(1), 10) - 1;
      el('circle', {cx:PX(col), cy:PY(row), r:R()*1.17, fill:'none',
                    stroke:'#e0483c', 'stroke-width':'2.6'}, winLayer);
    }

    if (winCells){
      winCells.forEach(c => {
        el('circle', {cx:PX(c % N), cy:PY(Math.floor(c / N)), r:R()*1.28, fill:'none',
                      stroke:'#4fb477', 'stroke-width':'3', filter:'url(#glow)'}, winLayer);
      });
    }
  }

  function renderPanel(){
    if (setupMode){
      whoSub.innerHTML = `摆棋模式 · 点击放子，右键删除&nbsp;&nbsp;当前画 ${colorName(setupTurn)}棋`;
    } else {
      whoSub.innerHTML = twoPlayer
        ? `双人对战 · 两人轮流点击落子&nbsp;&nbsp;先手：${colorName(firstSide)}`
        : `● 黑 = ${humanSide === 'B' ? '你' : 'AI'}&nbsp;&nbsp;&nbsp;` +
          `○ 白 = ${humanSide === 'W' ? '你' : 'AI'}&nbsp;&nbsp;&nbsp;` +
          `先手：${colorName(firstSide)}`;
    }

    statusBox.className = 'status';
    if (setupMode){
      statusBox.classList.add('think');
      statusText.textContent = `摆棋中：${colorName(setupTurn)}棋 · 已放 ${setupMoves.length} 子`;
    } else if (status === 'playing'){
      if (thinking){
        statusBox.classList.add('think');
        statusText.textContent = 'AI 思考中…';
      } else if (twoPlayer){
        const s = actingSide();
        const extra = handicapLeft > 0 ? `（让子，还可下 ${handicapLeft} 手）` : '';
        statusText.textContent = `轮到 ${colorName(s)}棋${extra}`;
      } else {
        const s = actingSide();
        const extra = handicapLeft > 0 ? `（让子，还可下 ${handicapLeft} 手）` : '';
        statusText.textContent = s === humanSide
          ? `轮到你（${colorName(humanSide)}棋）落子${extra}`
          : `轮到 AI（${colorName(s)}棋）${extra}`;
      }
    } else if (status === 'black_forbidden'){
      statusBox.classList.add('over');
      statusText.textContent = '黑棋走了禁手，判负';
    } else {
      statusBox.classList.add('over');
      let msg;
      if (status === 'draw') msg = '和棋';
      else if (twoPlayer){
        msg = `${colorName(status === 'black_win' ? 'B' : 'W')}棋五连，胜！`;
      } else {
        const winnerIsHuman = (status === 'black_win' && humanSide === 'B') ||
                              (status === 'white_win' && humanSide === 'W');
        msg = winnerIsHuman ? `你（${colorName(humanSide)}棋）五连，赢了！`
                            : `AI（${colorName(aiSide())}棋）五连，你输了`;
      }
      statusText.textContent = msg;
    }

    movesBox.innerHTML = '';
    const frag = document.createDocumentFragment();
    const list = setupMode ? setupMoves : moves;
    list.forEach((m, i) => {
      const d = document.createElement('div');
      d.className = 'mv' + (i === list.length - 1 ? ' last' : '');
      const tag = setupMode ? colorName(m.color)
                : twoPlayer ? colorName(m.color)
                : (m.color === humanSide ? '你' : 'AI');
      d.innerHTML = `<span class="n">${m.n}</span><span class="st ${m.color.toLowerCase()}"></span>` +
                    `<span class="c">${m.cell}</span><span class="tag">${tag}</span>`;
      frag.appendChild(d);
    });
    movesBox.appendChild(frag);
    movesBox.scrollTop = movesBox.scrollHeight;

    const canUndo = moves.length > 0 && !thinking;
    undoBtn.disabled = setupMode || !canUndo;
    copyRecordBtn.disabled = setupMode || moves.length === 0;
    svg.setAttribute('class', setupMode ? 'painting'
                      : thinking ? 'thinking'
                      : (status === 'playing' ? 'human' : ''));
  }

  function save(){
    try {
      localStorage.setItem('gomoku_v1', JSON.stringify({
        moves, status, winCells, humanSide, firstSide,
        twoPlayer, renju, handicap, handicapAi, nerf, handicapLeft, drawMode, boardSize,
      }));
    } catch (e) { /* file:// may block storage; ignore */ }
  }

  function load(){
    try {
      const raw = localStorage.getItem('gomoku_v1');
      if (!raw) return false;
      const st = JSON.parse(raw);
      if (!st || !Array.isArray(st.moves)) return false;
      moves = st.moves; status = st.status || 'playing'; winCells = st.winCells || null;
      if (st.humanSide) humanSide = st.humanSide;
      if (st.firstSide) firstSide = st.firstSide;
      twoPlayer = !!st.twoPlayer; renju = !!st.renju; drawMode = !!st.drawMode; boardSize = st.boardSize || 15;
      handicap = !!st.handicap; handicapAi = !!st.handicapAi; nerf = !!st.nerf;
      handicapLeft = st.handicapLeft || 0;
      explicitTurn = st.explicitTurn || null;
      board = new Int8Array(N * N);
      moves.forEach(m => { board[parseCoord(m.cell)] = m.color === 'B' ? 1 : 2; });
      return true;
    } catch (e) { return false; }
  }

  // ---------------------------------------------------------------- game logic
  function findWin(){
    const dirs = [[1,0],[0,1],[1,1],[1,-1]];
    for (let row = 0; row < N; row++){
      for (let col = 0; col < N; col++){
        const c = board[idx(col, row)];
        if (!c) continue;
        for (const [dx, dy] of dirs){
          const cells = [idx(col, row)];
          let ok = true;
          for (let s = 1; s < 5; s++){
            const nx = col + dx*s, ny = row + dy*s;
            if (nx < 0 || nx >= N || ny < 0 || ny >= N || board[idx(nx, ny)] !== c){ ok = false; break; }
            cells.push(idx(nx, ny));
          }
          if (ok) return cells;
        }
      }
    }
    return null;
  }

  function commit(cell, color){
    // renju: a black forbidden move is illegal - the stone is not placed at all
    if (renju && color === 'B'){
      const info = analyseBlackMove(board, cell % N, (cell / N) | 0);
      if (info.forbidden){
        toast('禁手：' + reasonName(info.reasons[0]) + '，黑棋不能下这里');
        svg.classList.add('shake');
        setTimeout(() => svg.classList.remove('shake'), 240);
        return false;
      }
    }

    board[cell] = color === 'B' ? 1 : 2;
    moves.push({n: moves.length + 1, color, cell: coordName(cell)});

    // Handicap: the handicapped side plays exactly one extra stone.
    // Because that breaks the move-count parity, the next player is stored
    // explicitly instead of being derived from moves.length.
    if (grantsExtraMove(color)) {
      handicapLeft--;
      explicitTurn = color;            // same side moves again
    } else {
      explicitTurn = other(color);     // normal alternation
    }

    const w = findWin();
    if (w){ winCells = w; status = color === 'B' ? 'black_win' : 'white_win'; }
    else if (moves.length >= N * N) status = 'draw';
    render(); renderPanel(); save();
    return true;
  }

  const reasonName = (r) => (r === 'overline' ? '长连' : r === 'double-four' ? '四四' : '三三');

  function aiThink(side){
    const budget = parseInt(levelSel.value, 10) || 1500;
    const e = new Engine();
    e.clear();
    for (const m of moves) e.place(parseCoord(m.cell), m.color === 'B' ? 1 : 2);
    const numeric = side === 'B' ? 1 : 2;

    // ---- draw / spoiler mode: never win, keep both sides away from five ----
    if (drawMode){
      const r = chooseDrawMove(e, numeric, { depth: 3, width: 14 });
      return {
        move: r.move, score: 0, depth: 3, nodes: 0, time: 0,
        pv: [r.move], note: r.note,
      };
    }

    // engine takes numeric sides: 1 = black, 2 = white
    const nerfed = nerf && turn() === firstSide;
    const opts = {
      maxDepth: nerfed ? 4 : 12,
      vcfDepth: nerfed ? 0 : 14,
      noVcf: nerfed,
      variety: true,
      varietyMargin: nerfed ? 160 : 40,
      renju,
    };
    return e.think(numeric, budget, opts);
  }

  function scheduleAI(){
    if (twoPlayer) return;
    const side = actingSide();
    if (status !== 'playing' || side !== aiSide() || thinking) return;
    thinking = true;
    renderPanel();
    const myGen = ++gen;
    setTimeout(() => {
      if (myGen !== gen){ return; }
      let res;
      try {
        res = aiThink(side);
      } catch (err){
        console.error(err);
        thinking = false; renderPanel();
        toast('AI 计算出错：' + err.message);
        return;
      }
      if (myGen !== gen) return;       // undone/restarted meanwhile
      thinking = false;
      if (res.move < 0){
        toast('AI 没有合法落点');
        status = 'black_forbidden';
        renderPanel();
        return;
      }
      commit(res.move, side);
      // handicap: the AI may owe a second stone in a row
      if (status === 'playing' && actingSide() === aiSide()) scheduleAI();
    }, 40);
  }

  // ---------------------------------------------------------------- interaction
  let toastTimer = null;
  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1500);
  }

  function svgPoint(ev){
    const pt = svg.createSVGPoint();
    // touch events carry the coordinates in touches/changedTouches
    const src = (ev.changedTouches && ev.changedTouches[0]) ||
                (ev.touches && ev.touches[0]) || ev;
    pt.x = src.clientX; pt.y = src.clientY;
    return pt.matrixTransform(svg.getScreenCTM().inverse());
  }

  // tolerance is generous on touch screens so fingers can hit the intersections
  const isTouch = () => {
    try { return !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches); }
    catch (e) { return false; }
  };
  const HIT = () => (isTouch() ? 0.62 : 0.48);

  function locate(ev){
    const p = svgPoint(ev);
    const col = Math.round((p.x - MARGIN) / CELL);
    const screenRow = Math.round((p.y - MARGIN) / CELL);
    if (col < 0 || col >= N || screenRow < 0 || screenRow >= N) return null;
    // must be close to the intersection
    if (Math.abs(p.x - PX(col)) > CELL * HIT()) return null;
    if (Math.abs(p.y - PY(N - 1 - screenRow)) > CELL * HIT()) return null;
    return {col, row: N - 1 - screenRow};
  }

  svg.addEventListener('mousemove', ev => {
    if (setupMode){
      const loc = locate(ev);
      if (!loc){ hoverLayer.setAttribute('opacity', '0'); return; }
      const cell = idx(loc.col, loc.row);
      if (eraseMode && board[cell] === 0){ hoverLayer.setAttribute('opacity', '0'); return; }
      if (!eraseMode && board[cell] !== 0){ hoverLayer.setAttribute('opacity', '0'); return; }
      ghost.setAttribute('cx', PX(loc.col));
      ghost.setAttribute('cy', PY(loc.row));
      ghostRing.setAttribute('cx', PX(loc.col));
      ghostRing.setAttribute('cy', PY(loc.row));
      hoverLayer.setAttribute('opacity', '1');
      return;
    }
    if (!showGhost.checked || thinking || status !== 'playing' || turn() !== humanSide){
      hoverLayer.setAttribute('opacity', '0');
      return;
    }
    const loc = locate(ev);
    if (!loc || board[idx(loc.col, loc.row)] !== 0){
      hoverLayer.setAttribute('opacity', '0');
      return;
    }
    ghost.setAttribute('cx', PX(loc.col));   ghost.setAttribute('cy', PY(loc.row));
    ghostRing.setAttribute('cx', PX(loc.col)); ghostRing.setAttribute('cy', PY(loc.row));
    hoverLayer.setAttribute('opacity', '1');
  });

  svg.addEventListener('mouseleave', () => hoverLayer.setAttribute('opacity', '0'));

  function handleTap(ev){
    // ---- setup mode: paint / erase freely, no turn order, no AI ----
    if (setupMode){
      const loc = locate(ev);
      if (!loc) return;
      const cell = idx(loc.col, loc.row);
      if (eraseMode || (ev.button === 2)){
        if (board[cell] === 0){ toast('这里是空的'); return; }
        board[cell] = 0;
        setupMoves = setupMoves.filter((m) => parseCoord(m.cell) !== cell);
      } else {
        if (board[cell] !== 0){ toast('这里已经有子了'); return; }
        board[cell] = setupTurn === 'B' ? 1 : 2;
        setupMoves.push({n: setupMoves.length + 1, color: setupTurn, cell: coordName(cell)});
        // alternate colours automatically, like placing stones by hand
        setupTurn = other(setupTurn);
      }
      render(); renderPanel(); updateSetupUI();
      return;
    }

    if (thinking) { toast('AI 正在思考…'); return; }
    if (status !== 'playing') { toast('本局已结束，按「重新开始」再来一局'); return; }
    const s = actingSide();
    if (!twoPlayer && s !== humanSide) return;

    const loc = locate(ev);
    if (!loc) return;
    const cell = idx(loc.col, loc.row);
    if (board[cell] !== 0){
      toast('这里已经有子了');
      svg.classList.add('shake');
      setTimeout(() => svg.classList.remove('shake'), 240);
      return;
    }

    // renju: refuse to place a forbidden black move (player keeps the turn)
    if (renju && s === 'B'){
      const info = analyseBlackMove(board, loc.col, loc.row);
      if (info.forbidden){
        toast('禁手：' + reasonName(info.reasons[0]) + '，黑棋不能下这里');
        svg.classList.add('shake');
        setTimeout(() => svg.classList.remove('shake'), 240);
        return;
      }
    }

    hoverLayer.setAttribute('opacity', '0');
    const placed = commit(cell, s);
    if (placed !== false && status === 'playing') scheduleAI();
  }

  // mouse + pen
  svg.addEventListener('click', handleTap);

  // right-click erases while painting
  svg.addEventListener('contextmenu', ev => {
    if (!setupMode) return;
    ev.preventDefault();
    const loc = locate(ev);
    if (!loc) return;
    const cell = idx(loc.col, loc.row);
    if (board[cell] === 0) return;
    board[cell] = 0;
    setupMoves = setupMoves.filter((m) => parseCoord(m.cell) !== cell);
    render(); renderPanel(); updateSetupUI();
  });

  // touch: act on touchend and suppress the synthetic click that follows
  let lastTouch = 0;
  svg.addEventListener('touchend', ev => {
    lastTouch = Date.now();
    if (ev.cancelable) ev.preventDefault();   // stops the 300ms delayed click / double fire
    handleTap(ev);
  }, { passive: false });
  svg.addEventListener('click', ev => {
    if (Date.now() - lastTouch < 700) return; // ignore the emulated click after a tap
  }, true);

  // ---------------------------------------------------------------- buttons
  function undo(){
    if (thinking) return;
    gen++;                     // cancel pending AI work
    thinking = false;
    let removed = 0;
    if (twoPlayer){
      if (moves.length){ popMove(); removed = 1; }
    } else {
      // drop trailing AI stones, then the human's last stone
      while (moves.length && moves[moves.length - 1].color !== humanSide){ popMove(); removed++; }
      if (moves.length && moves[moves.length - 1].color === humanSide){ popMove(); removed++; }
    }
    status = 'playing'; winCells = null;
    // After an undo the handicap has not been used yet unless a bonus stone
    // survived; recompute it from the remaining move list.
    explicitTurn = null;
    if (handicap){
      // the handicapped side has used its bonus iff it has more stones than the other side
      const hb = moves.filter((m) => m.color === handicapSide()).length;
      const ob = moves.filter((m) => m.color !== handicapSide()).length;
      handicapLeft = hb > ob ? 0 : 1;
    } else {
      handicapLeft = 0;
    }
    handicapPending = false;
    render(); renderPanel(); save();
    if (removed === 0) toast('还没有可以悔的棋');
    else toast('已悔棋');
    if (!twoPlayer && actingSide() === aiSide()) scheduleAI();
  }

  function popMove(){
    const m = moves.pop();
    board[parseCoord(m.cell)] = 0;
  }

  function restart(){
    gen++;
    thinking = false;
    moves = []; board = new Int8Array(N * N);
    status = 'playing'; winCells = null;
    handicapLeft = handicap ? 1 : 0;
    handicapPending = false;
    explicitTurn = null;
    render(); renderPanel(); save();
    if (!twoPlayer && actingSide() === aiSide()) scheduleAI();
  }

  undoBtn.addEventListener('click', undo);
  restartBtn.addEventListener('click', restart);
  showNum.addEventListener('change', render);
  levelSel.addEventListener('change', () => toast('AI 强度：' + levelSel.options[levelSel.selectedIndex].text));

  // ---------------------------------------------------------------- setup mode
  function updateSetupUI(){
    setupBtn.classList.toggle('on', setupMode);
    setupBtn.textContent = setupMode ? '✎ 摆棋中…' : '✎ 摆棋模式';
    setupBody.classList.toggle('open', setupMode);
    paintBlack.classList.toggle('active', setupTurn === 'B' && !eraseMode);
    paintWhite.classList.toggle('active', setupTurn === 'W' && !eraseMode);
    setupErase.classList.toggle('active', eraseMode);
    setupErase.style.background = eraseMode ? 'linear-gradient(180deg,#5a2a24,#3d1c18)' : '';
    setupErase.style.borderColor = eraseMode ? '#7a3a31' : '';
    setupHint.textContent = setupMode
      ? (eraseMode ? '擦除模式：点棋子删除' : `当前画${colorName(setupTurn)}棋 · 共 ${setupMoves.length} 子`)
      : '';
    svg.setAttribute('class', setupMode ? 'painting' : (thinking ? 'thinking' : (status === 'playing' ? 'human' : '')));
    undoBtn.disabled = setupMode || thinking || moves.length === 0;
    copyRecordBtn.disabled = setupMode || moves.length === 0;
  }

  function enterSetup(){
    gen++;
    thinking = false;
    setupMode = true;
    eraseMode = false;
    // keep whatever is on the board so the user can adjust a live position
    setupMoves = moves.slice();
    setupTurn = moves.length ? other(moves[moves.length - 1].color) : firstSide;
    status = 'playing'; winCells = null;
    render(); renderPanel(); updateSetupUI();
    toast('摆棋模式：点击棋盘放子');
  }

  function exitSetup(){
    setupMode = false;
    eraseMode = false;
    // rebuild the move list from the painted position
    moves = setupMoves.map((m, i) => ({n: i + 1, color: m.color, cell: m.cell}));
    // if the painted position has a five, show it
    const w = findWin();
    if (w){ winCells = w; status = moves[moves.length - 1].color === 'B' ? 'black_win' : 'white_win'; }
    else { winCells = null; status = 'playing'; }
    handicapLeft = 0;
    explicitTurn = null;
    render(); renderPanel(); updateSetupUI(); save();
    toast('摆棋完成，继续对局');
    if (status !== 'playing') return;

    if (setupNext.value === 'ai'){
      // Hand the next move to the AI, whichever colour is due.
      const s = actingSide();
      gen++;
      thinking = true;
      renderPanel();
      const myGen = gen;
      setTimeout(() => {
        if (myGen !== gen) return;
        let res;
        try { res = aiThink(s); }
        catch (err){ thinking = false; renderPanel(); toast('AI 出错：' + err.message); return; }
        if (myGen !== gen) return;
        thinking = false;
        if (res.move >= 0) commit(res.move, s);
        else renderPanel();
      }, 30);
      return;
    }

    // "我来下": the human continues; let the AI answer only if it is its turn
    if (!twoPlayer && actingSide() === aiSide()) scheduleAI();
  }

  setupBtn.addEventListener('click', () => {
    if (setupMode) exitSetup(); else enterSetup();
  });
  paintBlack.addEventListener('click', () => { setupTurn = 'B'; eraseMode = false; updateSetupUI(); });
  paintWhite.addEventListener('click', () => { setupTurn = 'W'; eraseMode = false; updateSetupUI(); });
  setupErase.addEventListener('click', () => { eraseMode = !eraseMode; updateSetupUI(); });
  setupClear.addEventListener('click', () => {
    board = new Int8Array(N * N);
    setupMoves = [];
    setupTurn = firstSide;
    render(); renderPanel(); updateSetupUI();
    toast('棋盘已清空');
  });
  setupDone.addEventListener('click', exitSetup);

  copyRecordBtn.addEventListener('click', async () => {
    const text = buildRecord();
    try {
      await navigator.clipboard.writeText(text);
      toast('棋谱已复制到剪贴板');
    } catch (e){
      // fallback for file:// where the clipboard API is unavailable
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      let ok = false;
      try { ok = document.execCommand('copy'); } catch (err) { ok = false; }
      document.body.removeChild(ta);
      toast(ok ? '棋谱已复制到剪贴板' : '复制失败，请手动选择下方棋谱');
      if (!ok) window.prompt('复制下面的棋谱：', text);
    }
  });

  function buildRecord(){
    const lines = [];
    const mode = twoPlayer ? '双人对战' : `你执${colorName(humanSide)}`;
    lines.push(`五子棋 15×15 · ${mode} · 先手${colorName(firstSide)}` +
               (renju ? ' · 禁手' : '') + (handicap ? ' · 让子' : ''));
    const parts = moves.map(m => `${m.n}.${m.color === 'B' ? '●' : '○'}${m.cell}`);
    for (let i = 0; i < parts.length; i += 8) lines.push(parts.slice(i, i + 8).join('  '));
    const result = status === 'playing' ? '进行中'
                 : status === 'draw' ? '和棋'
                 : status === 'black_forbidden' ? '黑棋禁手判负'
                 : (status === 'black_win' ? '黑棋胜' : '白棋胜');
    lines.push(`结果：${result}（共 ${moves.length} 手）`);
    return lines.join('\n');
  }

  togglePanelBtn.addEventListener('click', () => {
    rulesBox.classList.toggle('collapsed');
    togglePanelBtn.textContent = rulesBox.classList.contains('collapsed') ? '⚙ 设置' : '⚙ 收起';
  });

  optRenju.addEventListener('change', () => {
    renju = optRenju.checked;
    toast(renju ? '已开启禁手规则' : '已关闭禁手规则');
    restart();
  });
  optHandicap.addEventListener('change', () => {
    handicap = optHandicap.checked;
    optHandicapAi.disabled = !handicap;
    toast(handicap ? '已开启让子模式' : '已关闭让子模式');
    restart();
  });
  optHandicapAi.addEventListener('change', () => {
    handicapAi = optHandicapAi.checked;
    toast(handicapAi ? '让子给 AI' : '让子给你');
    restart();
  });
  optNerf.addEventListener('change', () => {
    nerf = optNerf.checked;
    toast(nerf ? 'AI 先手时自动降档' : 'AI 全力应对');
    restart();
  });

  optTwoPlayer.addEventListener('change', () => {
    twoPlayer = optTwoPlayer.checked;
    toast(twoPlayer ? '双人对战：AI 已关闭' : '已恢复人机对战');
    restart();
    syncControls();
  });

  optDrawMode.addEventListener('change', () => {
    drawMode = optDrawMode.checked;
    if (drawMode && twoPlayer){
      twoPlayer = false;
      optTwoPlayer.checked = false;
    }
    toast(drawMode ? '平局模式：AI 会阻止任何人成五' : '已关闭平局模式');
    restart();
    syncControls();
  });

  function syncControls(){
    sideSel.value = humanSide;
    firstColorSel.value = firstSide;
    optTwoPlayer.checked = twoPlayer;
    optDrawMode.checked = drawMode;
    boardSizeSel.value = String(boardSize);
    optRenju.checked = renju;
    optHandicap.checked = handicap;
    optHandicapAi.checked = handicapAi;
    optHandicapAi.disabled = !handicap || twoPlayer;
    optNerf.checked = nerf;
    sideSel.disabled = twoPlayer;
    levelSel.disabled = twoPlayer || drawMode;
    optNerf.disabled = twoPlayer || drawMode;
  }

  sideSel.addEventListener('change', () => {
    humanSide = sideSel.value;
    toast('你执' + colorName(humanSide) + '棋');
    restart();
  });

  firstColorSel.addEventListener('change', () => {
    firstSide = firstColorSel.value;
    toast(colorName(firstSide) + '棋先走');
    restart();
  });

  document.addEventListener('keydown', ev => {
    if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'z'){ ev.preventDefault(); undo(); }
    else if (!ev.ctrlKey && !ev.metaKey && ev.key.toLowerCase() === 'r'){ ev.preventDefault(); restart(); }
  });

  // ---------------------------------------------------------------- layout stability
  // The side panel changes height (move list, setup panel, toasts).  On desktop we
  // pin the board to a size derived only from the VIEWPORT, so nothing shifts when
  // the panel grows or shrinks.
  const mq = (q) => {
    try {
      return !!(window.matchMedia && window.matchMedia(q).matches);
    } catch (e) { return false; }
  };

  function lockBoardSize(){
    try {
      const wide = mq('(min-width: 821px)');
      const coarse = mq('(pointer: coarse)');
      if (!wide || coarse){
        svg.style.width = '';          // phones: CSS handles it
        svg.style.height = '';
        return;
      }
      const vh = window.innerHeight || 800;
      const vw = window.innerWidth || 1200;
      const size = Math.max(260, Math.min(vh * 0.72, vw * 0.58, 640));
      svg.style.width = size + 'px';
      svg.style.height = size + 'px';
    } catch (e) { /* never let layout code break the game */ }
  }
  lockBoardSize();

  let resizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(lockBoardSize, 80);
  });

  // ---------------------------------------------------------------- board size
  boardSizeSel.addEventListener('change', () => {
    boardSize = parseInt(boardSizeSel.value, 10) || 15;
    applyBoardSize(boardSize);
    restart();
    buildBoard();
    render(); renderPanel();
    toast(`棋盘 ${boardSize}×${boardSize}`);
    if (!twoPlayer && actingSide() === aiSide()) scheduleAI();
  });

  // ---------------------------------------------------------------- boot
  applyBoardSize(boardSize);
  buildBoard();
  if (load()){
    syncControls();
    render(); renderPanel();
    if (status === 'playing' && !twoPlayer && actingSide() === aiSide()) scheduleAI();
  } else {
    syncControls();
    render(); renderPanel();
    if (!twoPlayer && actingSide() === aiSide()) scheduleAI();   // AI opens when it has the first move
  }
})();
</script>
</body>
</html>
